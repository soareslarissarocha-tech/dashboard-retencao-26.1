<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <style>
        body { margin: 0; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #EDF2F7;
            font-family: 'Inter', sans-serif;
            color: #2D3748;
            overflow: hidden;
        }
        .header-block {
            background-color: #2D3748;
            padding-top: 60px;
            padding-left: 60px;
            padding-right: 60px;
            min-height: 160px;
        }
        h2 {
            color: #FFFFFF;
            font-size: 32px;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            max-width: 1000px;
        }
        .accent-bar {
            width: 120px;
            height: 8px;
            background-color: #E53E3E;
            margin-top: 12px;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 40px;
            padding-top: 40px;
            padding-left: 60px;
            padding-right: 60px;
        }
        .chart-card {
            background-color: #FFFFFF;
            padding-top: 40px;
            padding-left: 40px;
            padding-right: 40px;
            min-height: 400px;
            border-top: 8px solid #2B6CB0;
        }
        .insight-column {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .stat-block {
            background-color: #2B6CB0;
            color: #FFFFFF;
            padding-top: 30px;
            padding-left: 30px;
            padding-right: 30px;
            min-height: 180px;
        }
        .stat-value {
            font-size: 64px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 8px;
        }
        .stat-label {
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .recommendation-block {
            background-color: #FFFFFF;
            padding-top: 30px;
            padding-left: 30px;
            padding-right: 30px;
            min-height: 196px;
            border-top: 8px solid #E53E3E;
        }
        .rec-title {
            font-size: 20px;
            font-weight: 900;
            color: #E53E3E;
            margin-bottom: 16px;
            text-transform: uppercase;
        }
        .rec-text {
            font-size: 16px;
            line-height: 1.5;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header-block">
            <h2>Fevereiro concentra o maior volume de pedidos de saída</h2>
            <div class="accent-bar"></div>
        </div>
        <div class="main-content">
            <div class="chart-card">
                <div style="height: 320px; width: 100%;">
                    <canvas id="seasonalityChart"></canvas>
                </div>
            </div>
            <div class="insight-column">
                <div class="stat-block">
                    <div class="stat-value">63,5%</div>
                    <div class="stat-label">Das solicitações ocorrem em Fevereiro</div>
                </div>
                <div class="recommendation-block">
                    <div class="rec-title">Ação Necessária</div>
                    <div class="rec-text">
                        O pico coincide com o início das aulas. <br><br>
                        É imperativo <span style="color: #E53E3E; font-weight: 900;">antecipar as campanhas de retenção para Janeiro</span> para mitigar o volume crítico de Fevereiro.
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const ctx = document.getElementById('seasonalityChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Dez/25', 'Jan/26', 'Fev/26', 'Mar/26'],
                datasets: [{
                    label: 'Solicitações',
                    data: [9, 23, 80, 14],
                    borderColor: '#2B6CB0',
                    backgroundColor: 'rgba(43, 108, 176, 0.1)',
                    borderWidth: 6,
                    pointRadius: 8,
                    pointBackgroundColor: '#E53E3E',
                    pointBorderColor: '#FFFFFF',
                    pointBorderWidth: 3,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: '#EDF2F7' },
                        ticks: { font: { family: 'Inter', weight: 'bold' } }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { font: { family: 'Inter', weight: 'bold' } }
                    }
                }
            }
        });
    </script>
</body>
</html>
